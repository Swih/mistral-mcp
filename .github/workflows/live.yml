name: Live API tests

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      ocr_probe:
        description: One isolated OCR page instead of the full live suite
        type: boolean
        default: false

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Without this guard the suite skipIf's every test and the job still goes
      # green — the cron reported success for weeks while running nothing.
      - name: Require the MISTRAL_API_KEY secret
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: |
          if [ -z "$MISTRAL_API_KEY" ]; then
            echo "::error::MISTRAL_API_KEY repository secret is not set. The live suite would skip all tests and still pass."
            exit 1
          fi
      - name: Probe one OCR page without retries
        if: inputs.ocr_probe == true
        run: node scripts/probe-ocr.mjs
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      - run: npm run test:live -- --reporter=default --reporter=json --outputFile=live-results.json
        if: inputs.ocr_probe != true
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          # Small and Medium can have a zero request limit on Free-mode orgs.
          # This model exercises the same Chat, tool-calling and JSON-schema paths.
          MISTRAL_DEFAULT_MODEL: ministral-3b-latest
      - name: Preserve live test results, including skipped tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-test-results
          path: |
            live-results.json
            ocr-probe.json
          retention-days: 7
          if-no-files-found: warn
